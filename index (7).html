<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>As Your Dreamie Wish</title>
<meta name="theme-color" content="#b30707">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bubblegum: #ffc2dc;
    --hot: #c8102e;
    --aqua: #2f7d4a;
    --lime: #ffe08a;
    --lilac: #ffd9e8;
    --ink: #4a0808;
    --sky: #b30707;
    --white: #ffffff;
    --display: 'Montserrat', 'Arial Black', 'Helvetica Neue', Arial, sans-serif;
    --body: 'Montserrat', 'Helvetica Neue', Arial, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; }
  body {
    font-family: var(--body);
    font-weight: 600;
    color: var(--white);
    background: radial-gradient(circle at 50% 0%, #d31414 0%, #b30707 45%, #8f0505 100%);
    background-attachment: fixed;
    display: flex;
    justify-content: center;
    padding: 28px 16px 48px;
  }
  #snow { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 0; }
  main { width: min(420px, 100%); text-align: center; position: relative; z-index: 1; }
  h1 {
    font-family: var(--display);
    font-weight: 800;
    font-size: clamp(2rem, 9.5vw, 2.9rem);
    line-height: 1.05;
    margin: 6px 0 12px;
    color: var(--white);
    text-shadow: 0 0 6px rgba(255,255,255,.95), 0 0 22px rgba(255,255,255,.55);
    letter-spacing: .5px;
  }
  .sub { margin: 0 auto 6px; max-width: 30ch; font-size: 1.02rem; }

  /* machine */
  .machine { position: relative; width: min(340px, 92%); margin: 0 auto; }
  .machine svg { width: 100%; height: auto; display: block; overflow: visible; filter: drop-shadow(0 10px 14px rgba(60,0,0,.35)); }
  #knob { transform-origin: 150px 292px; transform-box: view-box; }
  .capsule {
    position: absolute; left: 50%; top: 74%;
    width: 17%; aspect-ratio: 1;
    margin-left: -8.5%;
    border-radius: 50%;
    border: 3px solid var(--ink);
    overflow: hidden;
    display: none;
    z-index: 3;
    box-shadow: inset -6px -6px 0 rgba(74,8,8,.15);
  }
  .capsule .top, .capsule .bottom { position: absolute; left: 0; right: 0; height: 50%; transition: transform .5s cubic-bezier(.3,1.6,.5,1); }
  .capsule .top { top: 0; background: var(--cap, var(--aqua)); border-bottom: 3px solid var(--ink); }
  .capsule .bottom { bottom: 0; background: var(--white); }
  .capsule .top::after {
    content: ""; position: absolute; left: 18%; top: 18%; width: 26%; height: 22%;
    background: rgba(255,255,255,.75); border-radius: 50%; transform: rotate(-30deg);
  }
  .capsule.drop { display: block; animation: drop .6s cubic-bezier(.4,0,.6,1) forwards; }
  .capsule.ready { cursor: pointer; animation: wobble 1.4s ease-in-out infinite; }
  .capsule.open { animation: none; overflow: visible; border-color: transparent; box-shadow: none; }
  .capsule.open .top { transform: translate(-30%, -90%) rotate(-40deg); border: 3px solid var(--ink); border-radius: 100px 100px 0 0; }
  .capsule.open .bottom { transform: translate(20%, 40%) rotate(25deg); border: 3px solid var(--ink); border-radius: 0 0 100px 100px; }
  @keyframes drop {
    0%   { transform: translateY(-70%) scale(.6); opacity: 0; }
    30%  { opacity: 1; }
    70%  { transform: translateY(70%) scale(1); }
    82%  { transform: translateY(55%); }
    100% { transform: translateY(70%); }
  }
  @keyframes wobble {
    0%, 100% { transform: translateY(70%) rotate(0); }
    25% { transform: translateY(70%) rotate(-10deg); }
    75% { transform: translateY(70%) rotate(10deg); }
  }

  /* form */
  form { margin-top: 18px; display: grid; gap: 12px; }
  label { font-weight: 800; text-align: left; font-size: .95rem; }
  .field {
    display: flex; align-items: center;
    background: var(--white);
    border: 3px solid var(--ink);
    border-radius: 999px;
    box-shadow: 4px 4px 0 var(--ink);
    padding: 0 18px;
  }
  .field:focus-within { outline: 3px solid var(--white); outline-offset: 3px; }
  .field span { font-weight: 800; color: var(--hot); font-size: 1.15rem; }
  input {
    flex: 1; min-width: 0;
    border: 0; background: transparent; outline: none;
    font: inherit; font-weight: 800; font-size: 1.1rem; color: var(--ink);
    padding: 14px 8px;
  }
  input::placeholder { color: #9d92c4; font-weight: 600; }
  button {
    font-family: var(--display);
    font-size: 1.3rem;
    font-weight: 800;
    color: var(--hot);
    background: linear-gradient(180deg, #ffffff 0%, #ffe6f0 50%, var(--bubblegum) 100%);
    border: 3px solid var(--ink);
    border-radius: 999px;
    padding: 12px 20px 10px;
    box-shadow: 0 5px 0 var(--ink);
    cursor: pointer;
    transition: transform .1s, box-shadow .1s;
  }
  button:hover { filter: brightness(1.05); }
  button:active { transform: translateY(4px); box-shadow: 0 1px 0 var(--ink); }
  button:focus-visible { outline: 3px solid var(--white); outline-offset: 3px; }
  button[disabled] { opacity: .6; cursor: default; transform: none; box-shadow: 0 5px 0 var(--ink); filter: none; }

  .msg { min-height: 1.4em; margin: 10px 0 0; font-weight: 800; }
  .msg.err { color: var(--lime); }

  /* result */
  .result {
    display: none;
    margin-top: 14px;
    background: var(--white);
    border: 3px solid var(--ink);
    border-radius: 28px;
    box-shadow: 6px 6px 0 var(--ink);
    padding: 22px 20px 20px;
    color: var(--ink);
  }
  .result.show { display: block; animation: pop .5s cubic-bezier(.3,1.6,.5,1); }
  .result .lead { margin: 0; font-size: 1rem; }
  .result .prize {
    font-family: var(--display);
    font-weight: 800;
    font-size: clamp(1.7rem, 8vw, 2.3rem);
    line-height: 1.05;
    margin: 6px 0 10px;
    color: var(--hot);
    text-shadow: 2px 2px 0 var(--lilac);
    overflow-wrap: anywhere;
  }
  .result .who { margin: 0 0 8px; font-weight: 800; }
  .result .note { margin: 0; font-size: .92rem; }
  @keyframes pop { from { transform: scale(.7); opacity: 0; } to { transform: scale(1); opacity: 1; } }

  .logo { display: none; max-width: 160px; max-height: 90px; margin: 0 auto 8px; object-fit: contain; }
  .prize-img {
    display: none; width: min(240px, 80%); aspect-ratio: 1; object-fit: contain;
    margin: 0 auto 12px; border-radius: 22px; border: 3px solid var(--ink); box-shadow: 4px 4px 0 var(--ink);
    background: #fff5f9;
  }
  .preview {
    display: none; margin: 0 auto 10px; padding: 4px 12px; border-radius: 999px;
    background: var(--lime); color: var(--ink); border: 2px solid var(--ink); font-size: .8rem; font-weight: 800; width: fit-content;
  }

  @media (prefers-reduced-motion: reduce) {
    .capsule.drop, .capsule.ready, .result.show { animation-duration: .01s; animation-iteration-count: 1; }
    .capsule .top, .capsule .bottom { transition: none; }
  }
</style>
</head>
<body>
<canvas id="snow" aria-hidden="true"></canvas>
<main>
  <div class="preview" id="preview">Preview mode: results are not saved</div>
  <img class="logo" id="logo" alt="">
  <h1>As Your Dreamie Wish</h1>
  <p class="sub" id="sub"></p>

  <div class="machine" id="machine">
    <svg viewBox="0 0 300 420" role="img" aria-label="Candy machine full of colorful capsules">
      <defs>
        <clipPath id="globeClip"><circle cx="150" cy="130" r="100"/></clipPath>
        <linearGradient id="bodyGrad" x1="0" y1="0" x2="1" y2="0">
          <stop offset="0" stop-color="#ffa6cc"/><stop offset=".5" stop-color="#ffe6f0"/><stop offset="1" stop-color="#ff93bf"/>
        </linearGradient>
        <linearGradient id="chrome" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#ffffff"/><stop offset=".5" stop-color="#cfd8ff"/><stop offset="1" stop-color="#8fa0d8"/>
        </linearGradient>
      </defs>
      <!-- body -->
      <rect x="62" y="215" width="176" height="150" rx="30" fill="url(#bodyGrad)" stroke="#4a0808" stroke-width="4"/>
      <rect x="40" y="352" width="220" height="42" rx="21" fill="#2f7d4a" stroke="#4a0808" stroke-width="4"/>
      <!-- globe -->
      <circle cx="150" cy="130" r="100" fill="#ffffff" fill-opacity=".55"/>
      <g clip-path="url(#globeClip)" id="balls"></g>
      <circle cx="150" cy="130" r="100" fill="none" stroke="#4a0808" stroke-width="4"/>
      <path d="M92 78 A72 72 0 0 1 140 52" fill="none" stroke="#fff" stroke-width="9" stroke-linecap="round" opacity=".85"/>
      <rect x="92" y="222" width="116" height="16" rx="8" fill="url(#chrome)" stroke="#4a0808" stroke-width="4" transform="translate(0,-10)"/>
      <!-- knob -->
      <g id="knob">
        <circle cx="150" cy="292" r="36" fill="url(#chrome)" stroke="#4a0808" stroke-width="4"/>
        <rect x="118" y="286" width="64" height="12" rx="6" fill="#4a0808"/>
      </g>
      <!-- chute -->
      <rect x="116" y="326" width="68" height="34" rx="14" fill="#4a0808"/>
      <text x="150" y="382" text-anchor="middle" font-family="Montserrat, Arial Black, sans-serif" font-weight="800" font-size="15" fill="#ffffff">TWIST</text>
    </svg>
    <div class="capsule" id="capsule" role="button" tabindex="0" aria-label="Open your capsule">
      <div class="top"></div><div class="bottom"></div>
    </div>
  </div>

  <form id="form" autocomplete="off" novalidate>
    <label for="ig">Your Instagram name</label>
    <div class="field">
      <span aria-hidden="true">@</span>
      <input id="ig" name="ig" type="text" inputmode="text" autocapitalize="none" autocorrect="off" spellcheck="false" maxlength="31" placeholder="yourname" required>
    </div>
    <button id="go" type="submit">Twist it!</button>
    <p class="msg" id="msg" role="status" aria-live="polite"></p>
  </form>

  <section class="result" id="result" aria-live="polite">
    <img class="prize-img" id="prizeImg" alt="">
    <p class="lead" id="lead">You got</p>
    <p class="prize" id="prize"></p>
    <p class="who" id="who"></p>
    <p class="note" id="note"></p>
  </section>
</main>

  },
  // Only used in preview mode (before SCRIPT_URL is set)
  DEMO_PRIZES: ['Chenle Banner', 'Haechan Banner 1', 'Haechan Banner 2', 'Jaemin Card Holder', 'Jaemin Case Pouch', 'Jeno Banner', 'Jeno Frame Card', 'Jisung 4 Cut Collect Book', 'Jisung Clear Pouch', 'Mark Frame Card Blue', 'Mark Frame Card Red', 'Mark Hand Fan', 'NCT DREAM Card Holder', 'Renjun Frame Card', 'Renjun Hand Towel']
};
/* ========================================= */

const $ = id => document.getElementById(id);
const form = $('form'), ig = $('ig'), go = $('go'), msg = $('msg');
const capsule = $('capsule'), result = $('result'), knob = $('knob');
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
const PREVIEW = CONFIG.SCRIPT_URL.indexOf('PASTE_') === 0;
/* wake up the Google script early so the first draw is not slow */
if (!PREVIEW) { try { fetch(CONFIG.SCRIPT_URL, { mode: 'no-cors' }).catch(() => {}); } catch (e) {} }
const COLORS = ['#d81b1b', '#2f8f4e', '#ffb3d1', '#ffffff', '#ffd23f', '#ff6f91'];

$('sub').textContent = CONFIG.SUBTITLE;
if (PREVIEW) $('preview').style.display = 'block';
if (CONFIG.LOGO) { const l = $('logo'); l.src = CONFIG.LOGO; l.style.display = 'block'; }

/* fill the globe with capsules */
const ballsG = $('balls'), ns = 'http://www.w3.org/2000/svg';
const balls = [];
(function fill() {
  const rows = [[110,190,110],[80,150,150],[105,150,190],[70,130,100],[120,165,130],[85,145,205],[125,175,185],[75,180,165]];
  const pts = [
    [100,70],[150,60],[200,70],[70,110],[120,105],[175,105],[225,110],
    [90,150],[145,148],[200,150],[75,190],[125,192],[178,190],[225,188],[105,215],[160,222],[205,215]
  ];
  pts.forEach((p, i) => {
    const g = document.createElementNS(ns, 'g');
    const c = document.createElementNS(ns, 'circle');
    c.setAttribute('cx', p[0]); c.setAttribute('cy', p[1]); c.setAttribute('r', 22);
    c.setAttribute('fill', COLORS[i % COLORS.length]);
    c.setAttribute('stroke', '#4a0808'); c.setAttribute('stroke-width', 3);
    const h = document.createElementNS(ns, 'circle');
    h.setAttribute('cx', p[0] - 7); h.setAttribute('cy', p[1] - 8); h.setAttribute('r', 5);
    h.setAttribute('fill', '#fff'); h.setAttribute('opacity', .7);
    g.appendChild(c); g.appendChild(h);
    ballsG.appendChild(g); balls.push(g);
  });
})();

function shake(ms) {
  if (reduce) return;
  balls.forEach(b => {
    const r = () => (Math.random() - .5) * 46;
    b.animate(
      [{ transform: 'translate(0,0)' }, { transform: `translate(${r()}px,${r()}px)` },
       { transform: `translate(${r()}px,${r()}px)` }, { transform: `translate(${r()}px,${r()}px)` },
       { transform: 'translate(0,0)' }],
      { duration: ms, easing: 'ease-in-out' }
    );
  });
  knob.animate([{ transform: 'rotate(0)' }, { transform: 'rotate(360deg)' }], { duration: ms * .7, easing: 'ease-in-out' });
}

const wait = ms => new Promise(r => setTimeout(r, ms));

function cleanName(v) {
  return v.trim().replace(/^@/, '').toLowerCase();
}

function setMsg(text, isErr) {
  msg.textContent = text || '';
  msg.className = 'msg' + (isErr ? ' err' : '');
}

async function callServer(username) {
  if (PREVIEW) {
    await wait(300);
    return { ok: true, prize: CONFIG.DEMO_PRIZES[Math.floor(Math.random() * CONFIG.DEMO_PRIZES.length)] };
  }
  const res = await fetch(CONFIG.SCRIPT_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
    body: JSON.stringify({ username })
  });
  return res.json();
}

const ERRORS = {
  bad_username: 'That Instagram name does not look right. Use letters, numbers, dots and underscores only.',
  sold_out: 'All prizes are gone. Thanks for playing!',
  busy: 'Lots of people are playing right now. Please try again in a few seconds.',
  server_error: 'Something went wrong on our side. Please try again.'
};

let pending = null;

form.addEventListener('submit', async e => {
  e.preventDefault();
  const username = cleanName(ig.value);
  if (!/^[a-z0-9._]{1,30}$/.test(username)) {
    setMsg(ERRORS.bad_username, true);
    ig.focus();
    return;
  }

  go.disabled = true; ig.disabled = true;
  setMsg('Twisting...');
  result.classList.remove('show');
  capsule.className = 'capsule';

  const spin = 1100;
  shake(spin);

  let data;
  try {
    [data] = await Promise.all([callServer(username), wait(spin)]);
  } catch (err) {
    data = { ok: false, error: 'network' };
  }

  if (!data.ok && data.error !== 'already_played') {
    setMsg(ERRORS[data.error] || 'Could not connect. Check your internet and try again.', true);
    go.disabled = false; ig.disabled = false;
    return;
  }

  const again = !data.ok && data.error === 'already_played';
  pending = { username, prize: data.prize, again };
  setMsg(again ? 'This name already played. Here is your earlier result.' : 'Your capsule is here! Tap it to open.');

  capsule.style.setProperty('--cap', COLORS[Math.floor(Math.random() * COLORS.length)]);
  capsule.className = 'capsule drop';
  await wait(reduce ? 50 : 600);
  capsule.className = 'capsule drop ready';
  capsule.focus({ preventScroll: true });
});

async function openCapsule() {
  if (!pending || !capsule.classList.contains('ready')) return;
  const p = pending; pending = null;
  capsule.className = 'capsule drop open';
  await wait(reduce ? 50 : 550);

  $('lead').textContent = p.again ? 'Your earlier prize' : 'You got';
  $('prize').textContent = p.prize;
  const img = $('prizeImg'), src = CONFIG.PRIZE_IMAGES[p.prize];
  if (src) { img.src = src; img.alt = p.prize; img.style.display = 'block'; } else { img.style.display = 'none'; }
  $('who').textContent = '@' + p.username;
  $('note').textContent = CONFIG.CLAIM_NOTE;
  result.classList.add('show');
  result.scrollIntoView({ behavior: reduce ? 'auto' : 'smooth', block: 'nearest' });
  setMsg('');
  // Each name can only play once, so the form stays locked.
  go.textContent = 'Played';
}

capsule.addEventListener('click', openCapsule);
capsule.addEventListener('keydown', e => {
  if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); openCapsule(); }
});

/* falling snow */
(function snow() {
  const cv = $('snow'), ctx = cv.getContext('2d');
  let w, h, flakes = [];
  function size() {
    const dpr = window.devicePixelRatio || 1;
    w = innerWidth; h = innerHeight;
    cv.width = w * dpr; cv.height = h * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  size(); addEventListener('resize', size);
  const n = Math.round(Math.min(90, Math.max(40, innerWidth / 12)));
  for (let i = 0; i < n; i++) {
    flakes.push({ x: Math.random() * w, y: Math.random() * h, r: 1 + Math.random() * 3.2, v: .3 + Math.random() * .9, d: Math.random() * Math.PI * 2 });
  }
  function draw() {
    ctx.clearRect(0, 0, w, h);
    ctx.fillStyle = 'rgba(255,255,255,.9)';
    for (const f of flakes) {
      ctx.beginPath(); ctx.arc(f.x, f.y, f.r, 0, 6.2832); ctx.fill();
      if (!reduce) {
        f.y += f.v; f.d += .01; f.x += Math.sin(f.d) * .4;
        if (f.y > h + 5) { f.y = -5; f.x = Math.random() * w; }
      }
    }
    if (!reduce) requestAnimationFrame(draw);
  }
  draw();
})();
</script>
